version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/research_connect
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:5000
      - JWT_SECRET=supersecretjwtkeyforresearchconnectlocal
      - JWT_REFRESH_SECRET=supersecretjwtrefreshkeyforresearchconnectlocal
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
